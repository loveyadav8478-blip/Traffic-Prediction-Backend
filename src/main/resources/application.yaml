spring:
  application:
    name: traffic_pred

  datasource:
    url: ${DB_URL}?prepareThreshold=0&reWriteBatchedInserts=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 60000
      connection-test-query: SELECT 1
      auto-commit: false
      pool-name: HikariPool-Routex

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        order_inserts: true
        order_updates: true
        batch_versioned_data: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false

#  jackson:
#    serialization:
#      write-dates-as-timestamps: false

scheduling:
  enabled: true

server:
  port: ${PORT:8080}

fastapi:
  username: ${FASTAPI_USERNAME}
  api-key: ${FAST_API_KEY}
  predict-url: ${PREDICT_URL}
  login-url: ${FASTAPI_LOGIN_URL}
  password: ${FASTAPI_PASSWORD}

mistral:
  api:
    key: ${GEMINI_API_KEY}
  model: mistral-small-latest
  max-tokens: 512
  temperature: 0.3

routex:
  weather:
    lat: 28.6139
    lon: 77.2090

  alerts:
    congestion-threshold: 20
    weather-impact-threshold: 10
    ecosystem-score-threshold: 60.0


app:
  jwt:
    secret: "mysecretkeymysecretkeymysecretkey12345"
    access-token-expiry-ms:  900000
    refresh-token-expiry-ms: 604800000