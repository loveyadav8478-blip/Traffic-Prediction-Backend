spring:
  application:
    name: traffic_pred

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      idle-timeout: 10000
      max-lifetime: 30000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 15000
      auto-commit: true
      pool-name: HikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: false

server:
  port: ${PORT}

fastapi:
  username: ${FASTAPI_USERNAME}
  api-key: ${FAST_API_KEY}
  predict-url: ${PREDICT_URL}
  login-url: ${FASTAPI_LOGIN_URL}
  password: ${FASTAPI_PASSWORD}

kind: Application
