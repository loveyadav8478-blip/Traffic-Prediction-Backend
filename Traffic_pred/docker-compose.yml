version: '3'

services:
  app1:
    build: .
    environment:
      - APP_NAME=App1
      - DB_URL=jdbc:mysql://host.docker.internal:3306/traffic_db
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    ports:
      - "8081:8080"

  app2:
    build: .
    environment:
      - APP_NAME=App2
      - DB_URL=jdbc:mysql://host.docker.internal:3306/traffic_db
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    ports:
      - "8082:8080"

  app3:
    build: .
    environment:
      - APP_NAME=App3
      - DB_URL=jdbc:mysql://host.docker.internal:3306/traffic_db
      - DB_USERNAME=root
      - DB_PASSWORD=root123
    ports:
      - "8083:8080"